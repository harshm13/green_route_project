version: '3.8'

services:
  greenroute-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: greenroute-enterprise
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    volumes:
      - ./green_route.db:/app/green_route.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
