<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GreenRoute - Authentication & Access</title>
    <link rel="stylesheet" href="css/global.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
            position: relative;
            overflow: hidden;
        }

        /* Ambient glowing circles */
        .auth-container::before {
            content: '';
            position: absolute;
            width: 500px;
            height: 500px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(52, 211, 153, 0.25) 0%, rgba(16, 185, 129, 0) 70%);
            top: -100px;
            left: -100px;
            z-index: 0;
            pointer-events: none;
        }

        .auth-container::after {
            content: '';
            position: absolute;
            width: 450px;
            height: 450px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(186, 230, 253, 0.4) 0%, rgba(56, 189, 248, 0) 70%);
            bottom: -80px;
            right: -80px;
            z-index: 0;
            pointer-events: none;
        }

        .auth-card {
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: var(--border-radius-card);
            box-shadow: 0 20px 45px -10px rgba(16, 185, 129, 0.15), 0 10px 20px -5px rgba(0, 0, 0, 0.04);
            width: 100%;
            max-width: 500px;
            padding: 2.5rem;
            box-sizing: border-box;
            position: relative;
            z-index: 1;
            transition: all 0.3s ease;
        }

        .auth-brand {
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .auth-brand img {
            height: 44px;
            margin-bottom: 0.5rem;
        }

        /* Role Switcher Tabs */
        .role-tabs {
            display: flex;
            background: rgba(243, 244, 246, 0.8);
            border-radius: var(--border-radius-pill);
            padding: 4px;
            margin-bottom: 1.5rem;
            border: 1px solid var(--eco-border);
        }

        .role-tab-btn {
            flex: 1;
            padding: 0.6rem 1rem;
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 0.92rem;
            font-weight: 600;
            color: var(--eco-text-muted);
            border-radius: var(--border-radius-pill);
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .role-tab-btn.active {
            background: var(--eco-white);
            color: var(--eco-green-dark);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        /* Action Switcher (Sign In vs Register) */
        .action-toggle {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #E5E7EB;
        }

        .action-tab {
            padding: 0.5rem 0.5rem 0.75rem;
            background: none;
            border: none;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 600;
            color: var(--eco-text-light);
            cursor: pointer;
            position: relative;
            transition: color 0.2s;
        }

        .action-tab.active {
            color: var(--eco-green-dark);
        }

        .action-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 3px;
            background: var(--eco-green-primary);
            border-radius: 3px 3px 0 0;
        }

        /* Forms */
        .form-view {
            display: none;
            animation: fadeIn 0.35s ease forwards;
        }

        .form-view.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 1.15rem;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: var(--eco-text-dark);
            margin-bottom: 0.4rem;
        }

        .form-input {
            width: 100%;
            padding: 0.8rem 1rem;
            font-family: inherit;
            font-size: 0.95rem;
            color: var(--eco-text-dark);
            background: rgba(249, 250, 251, 0.85);
            border: 1.5px solid var(--eco-border);
            border-radius: var(--border-radius-input);
            box-sizing: border-box;
            transition: all 0.25s ease;
            outline: none;
        }

        .form-input:focus {
            background: var(--eco-white);
            border-color: var(--eco-green-primary);
            box-shadow: var(--shadow-input-focus);
        }

        .auth-submit-btn {
            width: 100%;
            margin-top: 0.5rem;
            padding: 0.85rem;
            font-size: 1rem;
        }

        /* Demo Quick Logins */
        .demo-quick-section {
            margin-top: 1.75rem;
            padding-top: 1.25rem;
            border-top: 1px dashed var(--eco-border);
            text-align: center;
        }

        .demo-title {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--eco-text-light);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 0.75rem;
        }

        .demo-btns {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .demo-btn {
            flex: 1;
            min-width: 120px;
            padding: 0.5rem 0.6rem;
            font-size: 0.82rem;
            font-weight: 600;
            border-radius: var(--border-radius-pill);
            border: 1px solid var(--eco-border);
            background: #F9FAFB;
            color: var(--eco-text-dark);
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        .demo-btn:hover {
            background: var(--eco-mint-light);
            border-color: var(--eco-green-primary);
            color: var(--eco-green-dark);
        }

        .back-nav-link {
            display: inline-block;
            margin-top: 1.25rem;
            color: var(--eco-text-light);
            text-decoration: none;
            font-size: 0.88rem;
            font-weight: 500;
            transition: color 0.2s;
        }

        .back-nav-link:hover {
            color: var(--eco-green-primary);
        }
    </style>
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <div class="auth-brand">
                <a href="index.html">
                    <img src="assets/logo.svg" alt="GreenRoute Logo">
                </a>
                <p id="dynamic-subtitle" style="color: var(--eco-text-light); font-size: 0.92rem; margin: 0;">Smart Waste Management Platform</p>
            </div>

            <!-- Role Selector Tabs -->
            <div class="role-tabs">
                <button type="button" class="role-tab-btn active" id="tab-citizen" onclick="switchRole('citizen')">
                    <span>🏡</span> Citizen
                </button>
                <button type="button" class="role-tab-btn" id="tab-admin" onclick="switchRole('admin')">
                    <span>🏢</span> Administrator
                </button>
            </div>

            <!-- Action Selector (Sign In vs Register) -->
            <div class="action-toggle">
                <button type="button" class="action-tab active" id="tab-login" onclick="switchAction('login')">Sign In</button>
                <button type="button" class="action-tab" id="tab-register" onclick="switchAction('register')">Create Account</button>
            </div>

            <div id="alert-container"></div>

            <!-- Shared Login Form -->
            <form class="form-view active" id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-email">Email Address</label>
                    <input type="email" id="login-email" class="form-input" required placeholder="name@domain.com">
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-input" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary auth-submit-btn">Sign In to Dashboard</button>
            </form>

            <!-- Citizen Registration Form -->
            <form class="form-view" id="citizen-register-form">
                <div class="form-group">
                    <label class="form-label" for="cit-name">Full Name</label>
                    <input type="text" id="cit-name" class="form-input" required placeholder="Kushal Bhatt">
                </div>
                <div class="form-group">
                    <label class="form-label" for="cit-email">Campus / Personal Email</label>
                    <input type="email" id="cit-email" class="form-input" required placeholder="kushal@sou.edu.in">
                </div>
                <div class="form-group">
                    <label class="form-label" for="cit-password">Create Password</label>
                    <input type="password" id="cit-password" class="form-input" required placeholder="••••••••" minlength="4">
                </div>
                <button type="submit" class="btn btn-primary auth-submit-btn">Create Citizen Account 🌱</button>
            </form>

            <!-- Admin Registration Form -->
            <form class="form-view" id="admin-register-form">
                <div class="form-group">
                    <label class="form-label" for="adm-name">Full Name</label>
                    <input type="text" id="adm-name" class="form-input" required placeholder="Vikram Mehta">
                </div>
                <div class="form-group">
                    <label class="form-label" for="adm-id">Employee / Facility ID</label>
                    <input type="text" id="adm-id" class="form-input" required placeholder="ADM-2026-X1">
                </div>
                <div class="form-group">
                    <label class="form-label" for="adm-email">Official Email</label>
                    <input type="email" id="adm-email" class="form-input" required placeholder="facilities.lead@sou.edu.in">
                </div>
                <div class="form-group">
                    <label class="form-label" for="adm-password">Create Password</label>
                    <input type="password" id="adm-password" class="form-input" required placeholder="••••••••" minlength="4">
                </div>
                <button type="submit" class="btn btn-primary auth-submit-btn">Request Admin Access 🏢</button>
            </form>

            <!-- 1-Click Fast Demo Logins -->
            <div class="demo-quick-section">
                <div class="demo-title">⚡ Fast Evaluation - 1-Click Demo Logins</div>
                <div class="demo-btns">
                    <button type="button" class="demo-btn" onclick="seedDemoAccount('citizen')">🌱 Citizen Demo</button>
                    <button type="button" class="demo-btn" onclick="seedDemoAccount('admin')">⚙️ Admin Demo</button>
                    <button type="button" class="demo-btn" onclick="seedDemoAccount('head_admin')">🛡️ Head Admin</button>
                </div>
            </div>

            <div style="text-align: center;">
                <a href="index.html" class="back-nav-link">← Return to GreenRoute Home</a>
            </div>
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="js/data-service.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
