<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="routeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Route Loop & Leaf Icon -->
  <g transform="translate(8, 6)" filter="url(#glow)">
    <!-- Circular smart route ring -->
    <path d="M 24,6 A 18,18 0 1,1 10,34" fill="none" stroke="url(#routeGrad)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="10" cy="34" r="3.5" fill="#10B981" />
    <circle cx="24" cy="6" r="3" fill="#34D399" />
    <!-- Dynamic Leaf -->
    <path d="M 24,14 C 36,14 40,26 36,36 C 26,40 14,36 14,24 C 18,24 24,18 24,14 Z" fill="url(#leafGrad)"/>
    <path d="M 18,32 Q 25,24 32,18" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- Typography -->
  <text x="60" y="32" font-family="'Outfit', 'Poppins', sans-serif" font-size="21" font-weight="800" fill="#064E3B" letter-spacing="-0.5">
    Green<tspan fill="#10B981">Route</tspan>
  </text>
  <text x="60" y="45" font-family="'Outfit', 'Poppins', sans-serif" font-size="8.5" font-weight="600" fill="#6B7280" letter-spacing="1.2">
    SMART WASTE LOGISTICS
  </text>
</svg>
