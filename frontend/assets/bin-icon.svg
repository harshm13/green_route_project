<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="binGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="lidGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
  </defs>

  <!-- IoT WiFi Sensor Rays -->
  <path d="M 24,11 A 12,12 0 0,1 40,11" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M 28,15 A 6,6 0 0,1 36,15" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="32" cy="18" r="1.5" fill="#10B981"/>

  <!-- Bin Lid -->
  <rect x="18" y="21" width="28" height="5" rx="2.5" fill="url(#lidGrad)"/>
  <rect x="27" y="19" width="10" height="3" rx="1.5" fill="#047857"/>

  <!-- Bin Body -->
  <path d="M 21,26 L 24,52 C 24.3,54 26,55.5 28,55.5 L 36,55.5 C 38,55.5 39.7,54 40,52 L 43,26 Z" fill="url(#binGrad)"/>

  <!-- Recyle Symbol on Bin -->
  <path d="M 32,32 L 34.5,36 L 29.5,36 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 35,42 L 31,45 L 33,39 Z" fill="#FFFFFF" opacity="0.9"/>
  <path d="M 29,42 L 31,38 L 27,40 Z" fill="#FFFFFF" opacity="0.9"/>

  <!-- Fill Level Indicator Line -->
