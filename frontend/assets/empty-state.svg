<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" width="320" height="200">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE" />
      <stop offset="100%" stop-color="#BAE6FD" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="hillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
  </defs>

  <!-- Ambient Cloud -->
  <path d="M 90,75 C 90,60 110,50 130,58 C 140,42 170,42 185,55 C 205,48 225,60 220,78 C 235,88 230,110 210,110 L 105,110 C 85,110 75,90 90,75 Z" fill="url(#cloudGrad)" opacity="0.6"/>

  <!-- Soft Green Hill Background -->
  <path d="M 30,170 Q 160,115 290,170 L 290,190 L 30,190 Z" fill="url(#hillGrad)" opacity="0.5"/>

  <!-- Central Circular Check Platform -->
  <circle cx="160" cy="115" r="46" fill="#FFFFFF" filter="drop-shadow(0px 8px 16px rgba(16, 185, 129, 0.2))"/>
  <circle cx="160" cy="115" r="40" fill="url(#badgeGrad)"/>

  <!-- Crisp Checkmark -->
  <path d="M 144,115 L 155,126 L 178,102" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating Sparkles & Leaves -->
  <circle cx="108" cy="80" r="3.5" fill="#10B981" opacity="0.7"/>
  <circle cx="218" cy="74" r="2.5" fill="#34D399" opacity="0.8"/>
  <circle cx="225" cy="140" r="4" fill="#6EE7B7" opacity="0.6"/>
  <circle cx="95" cy="135" r="3" fill="#38BDF8" opacity="0.5"/>
</svg>
